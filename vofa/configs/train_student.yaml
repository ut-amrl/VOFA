# Whole-body pre-kick training config
evaluation:
  success_distance_threshold: 0.3
  evaluation_interval: 100
  total_evaluation_steps: 1500 # 30s
  warm_up_steps: 10

basic:
  task: "T1VOFAStudent" # name of the task
  expert_path: ""
  checkpoint: null # set to -1 to load last saved model
  headless: false
  max_iterations: 10000 # set the maximum number of learning iterations to train for
  sim_device: "cuda:0" # device for physics simulation
  rl_device: "cuda:0" # device for the RL algorithm
  seed: 42 # seed - set to -1 to choose random seed
  description: ""

env:
  num_envs: 1024
  num_privileged_obs: 14
  num_proprioceptive: 67
  num_expert_obs: 59
  hist_len: 50
  num_actions: 23
  model_num_actions: 13
  perception_update_interval: 5
  env_spacing: 1.  # not used with plane terrain
  teleport_ball: false # the bound is too small 
  reset_ball_outside_field: False  # terminate the episode when the ball is outside of the field
  early_termination: true
  obj_name: box_real.urdf

camera:
  view_depth: false
  use_camera: true 
  width: 64
  height: 36
  enable_tensors: false
  horizontal_fov: 100.55598833715605
  near_clip: 0.1
  far_clip: 4
  camera_position: [0.05, 0, 0.5]
  x_angle_range: [0, 0] # degree
  y_angle_range: [-10, -10] # degree
  z_angle_range: [0, 0] # degree
  dis_noise: 0
  update_interval: 10

  # buffer
  buffer_len: 3
  resized_width: 32
  resized_height: 32

  # visual sim2real noise augmentations
  apply_noise: true 
  p_patch: 0.75
  p_corr: 0.75
  p_dropout: 1.0

  ground_row_threshold: 50.0
  ground_row_min_count: 6

  aug_n_patches: 3
  aug_patch_min_hfrac: 0.1
  aug_patch_max_hfrac: 0.35
  aug_patch_min_wfrac: 0.05
  aug_patch_max_wfrac: 0.14
  aug_patch_val_lo: 0.01
  aug_patch_val_hi: 0.23
  
  aug_corr_downsample: 16
  aug_corr_amp: 0.03

  aug_dropout_prob_min: 0.003
  aug_dropout_prob_max: 0.03

runner:
  horizon_length: 32
  mini_epochs: 20
  save_interval: 500
  use_wandb: true
  # hl_inference_interval: 5
  random_init_episode_length: true
  training_dagger: true

viewer:
  pos: [6., -6., 8.]  # [m]
  lookat: [0., 0., 0.]  # [m]
  record_video: true  # only in play
  record_interval: 20.  # [s]
  record_env_idx: 0

algorithm:
  model_class: "StudentCamActorCriticNew"
  learning_rate: 2.e-4
  adaptive_lr: false
  gamma: 0.995
  lam: 0.95
  bound_coef: 1.0
  entropy_coef: 0
  symmetric_coef: 10.
  desired_kl: 0.01
  init_logstd: -2.9
  # DAgger specific parameters
  max_dagger_dataset_size: 150000
  load_optimizer_for_bc: false
  loss_type: "huber"
  loss_scale: 10.0
  huber_delta: 0.1
  # Beta mixing schedule (coverage-gated)
  beta_decay_iterations: 2000  # Coverage-gated schedule instead
  beta_start: 1.0
  beta_end: 0.2

sim:
  dt: 0.005
  substeps: 1
  up_axis: "z"
  gravity: [0.0, 0.0, -9.81]
  physics_engine: "physx" # "physx" or "flex"
  physx:
    num_threads: 4 # Number of worker threads per scene used by PhysX - for CPU PhysX only.
    solver_type: 1 # 0: pgs, 1: tgs
    num_position_iterations: 8
    num_velocity_iterations: 3
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.5
    max_depenetration_velocity: 10.0
    default_buffer_size_multiplier: 5.0
    max_gpu_contact_pairs: 8388608 # 8*1024*1024
    num_subscenes: 4 # Splits the simulation into N physics scenes and runs each one in a separate thread
    contact_collection: 1 # 0: CC_NEVER (don't collect contact info), 1: CC_LAST_SUBSTEP (collect only contacts on last substep), 2: CC_ALL_SUBSTEPS (broken - do not use!)

asset:
  file: "resources/T1/T1_serial.urdf"  # Use URDF with articulated head
  mujoco_file: "resources/T1/T1_serial.xml" # Use corresponding MuJoCo file
  name: "T1"
  base_name: "Trunk"
  head_name: "H2"  # Specify the head link name
  foot_names: ["left_foot_link", "right_foot_link"]
  disable_gravity: false
  default_dof_drive_mode: 3 # see GymDofDriveModeFlags (0 is none, 1 is pos tgt, 2 is vel tgt, 3 effort)
  collapse_fixed_joints: true # bug: if collapse_fixed_joints = false, foot doesn't collide with ground
  fix_base_link: false # fix the base of the robot
  self_collisions: 0 # 1 to disable, 0 to enable...bitwise filter
  replace_cylinder_with_capsule: false # replace collision cylinders with capsules, leads to faster/more stable simulation
  flip_visual_attachments: false # Some .obj meshes must be flipped from y-up to z-up
  density: 0.001
  angular_damping: 0.
  linear_damping: 0.
  max_angular_velocity: 1000.
  max_linear_velocity: 1000.
  armature: 0.
  thickness: 0.01
  feet_edge_pos: [[ 0.1215,  0.05, -0.03],
                  [ 0.1215, -0.05, -0.03],
                  [-0.1015,  0.05, -0.03],
                  [-0.1015, -0.05, -0.03]] # x,y,z [m]

init_state:
  # robot 
  pos: [0.0, 0.0, 0.72] # x,y,z [m]
  rot: [0.0, 0.0, 0.0, 1.0] # x,y,z,w [quat]
  lin_vel: [0.0, 0.0, 0.0]  # x,y,z [m/s]
  ang_vel: [0.0, 0.0, 0.0]  # x,y,z [rad/s]
  default_joint_angles: {
    "AAHead_yaw": 0.0, # Added default for head yaw
    "Head_pitch": 0.0, # Added default for head pitch
    "Shoulder_Pitch": 0.2,
    "Left_Shoulder_Roll": -1.35, "Left_Elbow_Yaw": -0.5,
    "Right_Shoulder_Roll": 1.35, "Right_Elbow_Yaw": 0.5,
    "Hip_Pitch": -0.2, "Knee_Pitch": 0.4, "Ankle_Pitch": -0.25, "default": 0.} # target angles when action = 0.0

  # ball
  ball_pos: [0.0, 0.0, 0.52] # x,y,z [m]
  ball_lin_vel: [0.0, 0.0, 0.0]  # x,y,z [m/s]

control:
  stiffness: {
    "Shoulder": 20, "Elbow": 20, "Waist": 200,
    "Hip": 200., "Knee": 200., "Ankle": 50.,
    "Head": 5.  # Stiffness for head joints
  } # [N*m/rad]
  damping: {
    "Shoulder": 0.5, "Elbow": 0.5, "Waist": 5,
    "Hip": 5., "Knee": 5., "Ankle": 3.,
    "Head": 0.5  
  } # [N*m*s/rad]
  action_scale: 0.25
  decimation: 4

terrain:
  type: "plane" # "plane" or "trimesh"
  static_friction: 1.0  # [-]
  dynamic_friction: 1.0  # [-]
  restitution: 0.        # [-]
  # trimesh only:
  terrain_length: 10.
  terrain_width: 10.
  border_size: 5.
  num_terrains: 8
  terrain_proportions: [1.0, 0.0, 0.0, 0.0] # terrain types: [plane, slope, random, discrete]
  slope: 0.1
  random_height: 0.1
  discrete_height: 0.02
  horizontal_scale: 0.1
  vertical_scale: 0.005
  slope_threshold: 2.0

commands:
  num_commands: 3 # default: lin_vel_x, lin_vel_y, ang_vel_yaw
  still_proportion: 0.  # KICK: no standing still prob
  lin_vel_x: [0.7, 0.7] # min max [m/s]  (kick with constant max velocity)
  lin_vel_y: [0.0, 0.0] # min max [m/s]
  ang_vel_yaw: [1.6, 1.6]   # min max [rad/s]  (kick with constant max angular velocity)
  resampling_time_s: [80000000., 80000001.]
  gait_frequency: [1.5, 1.5] # min max [Hz]  (kick with constant max gait frequency)
  # curriculum only:
  curriculum: false
  update_rate: 0.1
  lin_vel_levels: 10
  ang_vel_levels: 10
  lin_vel_x_resolution: 0.2 # [m/s]
  lin_vel_y_resolution: 0.1 # [m/s]
  ang_vel_resolution: 0.2 # [rad/s]
  episode_length_toler: 0.1
  lin_vel_x_toler: 0.4 # [m/s]
  lin_vel_y_toler: 0.2 # [m/s]
  ang_vel_yaw_toler: 0.2 # [rad/s]

normalization:
  gravity: 1.0
  lin_vel: 1.0
  ang_vel: 1.0
  dof_pos: 1.0
  dof_vel: 0.1
  filter_weight: 0.1
  push_force: 0.1
  push_torque: 0.5
  clip_actions: 100.
  ball_pos: 1.0
  ball_vel: 1.0
  goal_pos: 0.2

noise:
  gravity:
    range: [0., 0.01]
    operation: "additive"
    distribution: "gaussian"
  lin_vel:
    range: [0., 0.05]
    operation: "additive"
    distribution: "gaussian"
  ang_vel:
    range: [0., 0.1]
    operation: "additive"
    distribution: "gaussian"
  dof_pos:
    range: [0., 0.01]
    operation: "additive"
    distribution: "gaussian"
  dof_vel:
    range: [0., 0.1]
    operation: "additive"
    distribution: "gaussian"
  height:
    range: [0., 0.02]
    operation: "additive"
    distribution: "gaussian"
  ball_pos:
    c_vel: 2.0
    c_min: 0.4
  goal_pos:
    c_vel: 1.0
    c_min: 0.6

task_sampler:
  sampling_strategy: "around_robot"
  init_ball_r:
    range: [1.8, 2.2]
    operation: "additive"
    distribution: "uniform"
  init_ball_angle:
    range: [-1.05, 1.05] # 60 deg
    operation: "additive"
    distribution: "uniform"
  ball_yaw_range: 0
  robot_yaw_min: -3.14
  robot_yaw_max: 3.14
  robot_yaw_mirror: false
  random_init_pos: 1
  fix_ball_angle: true
  goal_pos: [3,3]
  # evaluation
  num_repeats: 1
  # evaluation_ball_pos_center_x: [-1.5, -0.5, 0.5, 1.5, 2.5, 3.5, 4.5, 5.5, 6.5]
  # evaluation_ball_pos_center_y: [-4.0, -3.0, -2.0, -1.0, 0.0, 1.0, 2.0, 3.0, 4.0]
  evaluation_ball_pos_center_x: [0.5]
  evaluation_ball_pos_center_y: [-3.5]

randomization:
  box_mass: [1, 8]
  box_friction: [0.1, 1.0]
  init_dof_pos:
    range: [0., 0.05]
    operation: "additive"
    distribution: "gaussian"  
  init_base_pos_xy:  # always start from the origin
    range: [0.0, 0.0]
    operation: "additive"
    distribution: "uniform"
  init_base_lin_vel_xy:
    range: [0., 0.1]
    operation: "additive"
    distribution: "gaussian"

  # randomize ball velocity
  init_ball_lin_vel_xy:
    range: [0.0, 0.0]
    operation: "additive"
    distribution: "gaussian"

  # initial goal position relative to the ball
  init_goal_pos_theta:  # further away than the pre-training
    range: [-1.57, 1.57]
    operation: "additive"
    distribution: "uniform"
  init_goal_pos_r:
    range: [4.0, 8.0]
    operation: "additive"
    distribution: "uniform"

  kick_interval_s: 2.
  kick_lin_vel:
    range: [0., 0.4]
    operation: "additive"
    distribution: "gaussian"
  kick_ang_vel:
    range: [0., 0.1]
    operation: "additive"
    distribution: "gaussian"

  kick_ball_interval_s: 6.
  kick_ball_lin_vel:
    range: [-0.0, 0.0]
    operation: "additive"
    distribution: "gaussian"
  kick_ball_ang_vel:
    range: [-0.0, 0.0]
    operation: "additive"
    distribution: "gaussian"

  push_interval_s: 5.
  push_duration_s: 1.
  push_force:
    range: [0., 2.5] # decrease by 4
    operation: "additive"
    distribution: "gaussian"
  push_torque:
    range: [0., 0.5] # decrease by 4
    operation: "additive"
    distribution: "gaussian"

  dof_stiffness:
    range: [0.95, 1.05]
    operation: "scaling"
    distribution: "uniform"
  dof_damping:
    range: [0.95, 1.05]
    operation: "scaling"
    distribution: "uniform"
  dof_friction:
    range: [0.0, 2.0]
    operation: "additive"
    distribution: "uniform"

  friction:
    range: [0.1, 2.0]
    operation: "additive"
    distribution: "uniform"
  compliance:
    range: [0.5, 1.5]
    operation: "additive"
    distribution: "uniform"
  restitution:
    range: [0.1, 0.9]
    operation: "additive"
    distribution: "uniform"

  base_com:
    range: [-0.1, 0.1]
    operation: "additive"
    distribution: "uniform"
  base_mass:
    range: [0.8, 1.2]
    operation: "scaling"
    distribution: "uniform"
  other_com:
    range: [-0.005, 0.005]
    operation: "additive"
    distribution: "uniform"
  other_mass:
    range: [0.98, 1.02]
    operation: "scaling"
    distribution: "uniform"

rewards:
  scales:
    object_goal_reaching_gaussian: 2.5
    object_to_goal_reaching_velocity: 0.0
    ee_to_object_reaching: 1.25
    head_tracks_object: 1.0
    align_robot_goal: 2.0

  penalty_scales:
    default_upper_joints: -0.5
    object_balance: -0.5
    action_rate: -1.0

  # reward penalty parameters
  obj_goal_reaching_gaussian_sigma2: 10.0
  obj_goal_velocity_sigma2: 0.5
  obj_goal_min_speed: 0.01
  ee_object_sigma2: 2.0
  head_tracking_sigma2: 0.5
  head_tracking_fov: 1.05
  align_robot_goal_sigma2: 0.25
  align_robot_goal_close_obj_dist: 1.15
  align_robot_goal_misaligned_angle: 0.2
  action_rate_lower_weight: 2.0
  action_rate_upper_weight: 0.5
  # 

  penalty_schedule: [0.2, 1.0, 1000, 10000]
  episode_length_s: 30.
  terminate_height: 0.3
  terminate_vel: 50.
  terminate_contacts_on: []
  penalize_contacts_on: ["Trunk", "H1", "H2", "AL", "AR", "Waist", "Hip", "Shank", "Ankle"]
  only_positive_rewards: false  # KICK: recieving negative rewards is when moving towards the ball
  tracking_sigma: 0.25 # tracking reward = exp(-error^2/sigma)
  base_height_target: 0.68
  soft_dof_pos_limit: 1. # percentage of urdf limits, values above this limit are penalized
  soft_dof_vel_limit: 1.
  soft_torque_limit: 1.
  swing_period: 0.2
  feet_distance_ref: 0.2
  approach_ball_dist_min: 0.5
  target_dof_pos:
    AAHead_yaw: 0.0
    Head_pitch: 0.0
    Left_Elbow_Pitch: 0.0
    Left_Elbow_Yaw: -0.7
    Left_Shoulder_Pitch: -0.65
    Left_Shoulder_Roll: -1.35
    Right_Elbow_Pitch: 0.0
    Right_Elbow_Yaw: 0.7
    Right_Shoulder_Pitch: -0.65
    Right_Shoulder_Roll: 1.35

falcon_model:
  _target_: envs.base_falcon_model.FalconModel
  config:
    # hardcoded to match the pretrained FALCON model
    actor_obs_num: 93
    module_dict:
      actor_lower_body:
        history_length: 5
        output_dim: [13]
        layer_config:
          type: MLP
          hidden_dims: [512, 256, 128]
          activation: ELU
      actor_upper_body:
        history_length: 5
        output_dim: [10]
        layer_config:
          type: MLP
          hidden_dims: [512, 256, 128]
          activation: ELU
    checkpoint: models/falcon_model_10000.pt
falcon_obs:
    history_length: 5
    actor_obs_num: 93
    obs_dict:
      base_ang_vel: 3
      projected_gravity: 3
      command_lin_vel: 2
      command_ang_vel: 1
      # command_stande: 1 # hardcoded
      command_waist_dofs: 1 # only include 1
      command_base_height: 1
      ref_upper_dof_pos: 10
      dof_pos: 23
      dof_vel: 23
      actions: 23
    obs_scales: 
      base_orientation: 1.0
      base_lin_vel: 1.0
      base_ang_vel: 1.0
      projected_gravity: 1.0
      command_lin_vel: 1.0
      command_ang_vel: 1.0
      command_stand: 1.0
      command_waist_dofs: 1.0
      command_base_height: 2.0
      ref_upper_dof_pos: 1.0
      dof_pos: 1.0
      dof_vel: 0.1
      actions: 1.0
      sin_phase: 1.0
      cos_phase: 1.0
      left_ee_apply_force: 0.1
      right_ee_apply_force: 0.1
      history_actor: 1.0